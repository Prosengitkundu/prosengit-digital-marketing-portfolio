<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Prosengit Kundu</title>
    <meta name="description" content="The page you are looking for could not be found on prosengitkundu.top.">
    <meta name="robots" content="noindex, follow">

    <!-- ===== Shared design system (same loading + hover effects on every page) ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark *));
        @layer base {
            /* Tailwind v4 defaults a bare `border` to currentColor, which made
               borders look different from page to page. One shared colour. */
            *, ::before, ::after, ::backdrop {
                border-color: var(--color-gray-200, currentcolor);
            }
            .dark *, .dark ::before, .dark ::after, .dark ::backdrop {
                border-color: var(--color-gray-700, currentcolor);
            }
        }
    </style>
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        /* Apply the saved theme before paint so pages never flash. */
        (function () {
            try {
                var t = localStorage.getItem('pk-theme');
                if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
    <script src="assets/js/site.js" defer></script>
</head>
