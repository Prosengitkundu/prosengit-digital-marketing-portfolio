<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Paid advertising campaign concept artwork</title>
  <desc id="desc">A campaign dashboard concept with audience reach, clicks, and conversion metrics.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#102447"/><stop offset="1" stop-color="#16a34a"/></linearGradient></defs>
  <rect width="1200" height="700" rx="42" fill="url(#bg)"/>
  <rect x="75" y="78" width="1050" height="545" rx="28" fill="#ffffff" opacity=".11" stroke="#ffffff" stroke-opacity=".2"/>
  <text x="120" y="150" fill="#ffffff" font-family="Arial, sans-serif" font-size="27" font-weight="700">CAMPAIGN ENGINE</text>
  <text x="120" y="190" fill="#d4f7e1" font-family="Arial, sans-serif" font-size="17">Paid media concept</text>
  <g font-family="Arial, sans-serif"><text x="125" y="285" fill="#ffffff" font-size="42" font-weight="700">1,850</text><text x="125" y="315" fill="#d4f7e1" font-size="15">qualified leads</text><text x="400" y="285" fill="#ffffff" font-size="42" font-weight="700">4.2x</text><text x="400" y="315" fill="#d4f7e1" font-size="15">return on ad spend</text><text x="700" y="285" fill="#ffffff" font-size="42" font-weight="700">-28%</text><text x="700" y="315" fill="#d4f7e1" font-size="15">cost per lead</text></g>
  <rect x="120" y="395" width="950" height="130" rx="18" fill="#ffffff" opacity=".11"/>
  <rect x="155" y="440" width="170" height="38" rx="19" fill="#f59e0b"/><rect x="355" y="420" width="205" height="58" rx="19" fill="#ffffff" opacity=".8"/><rect x="590" y="400" width="250" height="78" rx="19" fill="#7ee7a2"/><rect x="870" y="370" width="150" height="108" rx="19" fill="#ffffff"/>
  <text x="120" y="575" fill="#d4f7e1" font-family="Arial, sans-serif" font-size="16">Audience research + creative testing + retargeting</text>
</svg>