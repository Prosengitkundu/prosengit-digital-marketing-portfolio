<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Article | Prosengit Kundu</title>
    <meta name="description" content="In-depth digital marketing, SEO and web development guides by Prosengit Kundu.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://prosengitkundu.top/blog-details.html">
    <meta property="og:type" content="article">
    <meta property="og:title" content="Blog Article | Prosengit Kundu">
    <meta property="og:description" content="In-depth digital marketing, SEO and web development guides.">

    <!-- ===== Shared design system (same loading + hover effects on every page) ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark *));
        @layer base {
            /* Tailwind v4 defaults a bare `border` to currentColor, which made
               borders look different from page to page. One shared colour. */
            *, ::before, ::after, ::backdrop {
                border-color: var(--color-gray-200, currentcolor);
            }
            .dark *, .dark ::before, .dark ::after, .dark ::backdrop {
                border-color: var(--color-gray-700, currentcolor);
            }
        }
    </style>
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        /* Apply the saved theme before paint so pages never flash. */
        (function () {
            try {
                var t = localStorage.getItem('pk-theme');
                if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
    <script src="assets/js/site.js" defer></script>
</head>
<body class="site-body">
<div class="page-shell">
    

    <div class="max-w-7xl mx-auto px-8 pt-16 pb-20">
        <a href="blog.html" class="text-sm font-semibold text-[#0A66C2]">← Back to All Articles</a>

        <div class="grid lg:grid-cols-12 gap-12 mt-8">
            <!-- Main article -->
            <article class="lg:col-span-8">
                <div id="article-content">
                    <div class="flex flex-wrap gap-3 items-center text-xs font-semibold"><span id="a-cat" class="text-[#0A66C2] bg-blue-50 dark:bg-gray-900 px-3 py-1 rounded-full"></span><span id="a-date" class="text-gray-400"></span><span class="text-gray-400">·</span><span id="a-read" class="text-gray-400"></span></div>
                    <h1 id="a-title" class="text-4xl md:text-5xl heading-font tracking-tighter font-bold mt-5 leading-[1.1]"></h1>
                    <p id="a-excerpt" class="text-lg text-gray-600 dark:text-gray-300 mt-5 leading-relaxed"></p>
                    <img id="a-img" src="" alt="" class="w-full aspect-[16/9] object-cover rounded-3xl mt-10" width="1200" height="680" fetchpriority="high">
                    <div id="a-body" class="article-body mt-10"></div>

                    <div class="mt-14 p-7 md:p-9 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-3xl">
                        <h2 class="text-2xl heading-font font-bold">Work With Me</h2>
                        <p class="mt-3 text-gray-600 dark:text-gray-300 leading-relaxed">I provide SEO, custom HTML/CSS/JavaScript web development, Google &amp; Meta Ads management, lead generation and complete digital growth plans — for clients in Bangladesh and worldwide.</p>
                        <div class="flex flex-wrap gap-3 mt-6">
                            <a href="pricing.html" class="premium-btn px-7 py-3 bg-[#0A66C2] text-white font-semibold rounded-3xl">View Pricing</a>
                            <a href="contact.html" class="premium-btn px-7 py-3 border border-gray-300 dark:border-gray-600 font-semibold rounded-3xl">Start a Project</a>
                        </div>
                    </div>

                    <!-- Prev / Next -->
                    <div class="grid sm:grid-cols-2 gap-4 mt-10" id="prev-next"></div>
                </div>
            </article>

            <!-- Sidebar -->
            <aside class="lg:col-span-4 space-y-8">
                <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-3xl p-7 sticky top-28">
                    <div class="text-xs tracking-[3px] font-semibold text-[#0A66C2]">IN THIS ARTICLE</div>
                    <nav id="a-toc" class="toc-link mt-4 space-y-0"></nav>
                    <div class="mt-8 pt-6 border-t border-gray-200 dark:border-gray-700">
                        <div class="text-xs tracking-[3px] font-semibold text-[#16A34A]">RELATED READING</div>
                        <div id="a-related" class="mt-4 space-y-4"></div>
                    </div>
                </div>
            </aside>
        </div>
    </div>
</div>

    <script src="assets/js/articles.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const id = parseInt(params.get('id')) || 1;
        const idx = Math.max(0, ARTICLES.findIndex(a => a.id === id));
        const article = ARTICLES[idx];

        // Metadata
        document.title = `${article.title} | Prosengit Kundu Blog`;
        document.querySelector('meta[name="description"]').setAttribute('content', article.excerpt);
        document.querySelector('link[rel="canonical"]').setAttribute('href', `https://prosengitkundu.top/blog-details.html?id=${article.id}`);
        document.querySelector('meta[property="og:title"]').setAttribute('content', article.title);
        document.querySelector('meta[property="og:description"]').setAttribute('content', article.excerpt);

        // Article schema
        const schema = document.createElement('script');
        schema.type = 'application/ld+json';
        schema.textContent = JSON.stringify({
            "@context": "https://schema.org",
            "@type": "Article",
            "headline": article.title,
            "description": article.excerpt,
            "datePublished": article.date,
            "author": {"@type": "Person", "name": "Prosengit Kundu", "url": "https://prosengitkundu.top/"},
            "publisher": {"@type": "Person", "name": "Prosengit Kundu"},
            "mainEntityOfPage": `https://prosengitkundu.top/blog-details.html?id=${article.id}`
        });
        document.head.appendChild(schema);

        // Content
        document.getElementById('a-cat').textContent = article.cat;
        document.getElementById('a-date').textContent = article.date;
        document.getElementById('a-read').textContent = article.read;
        document.getElementById('a-title').textContent = article.title;
        document.getElementById('a-excerpt').textContent = article.excerpt;
        const img = document.getElementById('a-img');
        img.src = article.img;
        img.alt = article.title + ' — illustrated article cover';
        document.getElementById('a-body').innerHTML = article.body;

        // Table of contents from H2s
        const toc = document.getElementById('a-toc');
        const h2s = document.querySelectorAll('#a-body h2');
        h2s.forEach((h2, i) => {
            h2.id = 's-' + i;
            const a = document.createElement('a');
            a.href = '#s-' + i;
            a.textContent = h2.textContent;
            toc.appendChild(a);
        });
        if (!h2s.length) toc.innerHTML = '<p class="text-sm text-gray-400">Article sections listed here.</p>';

        // Related articles (same category, excluding current)
        const related = ARTICLES.filter(a => a.cat === article.cat && a.id !== article.id).slice(0, 3);
        const relWrap = document.getElementById('a-related');
        relWrap.innerHTML = related.length ? related.map(r => `
            <a href="blog-details.html?id=${r.id}" class="block group">
                <div class="text-xs font-semibold text-[#0A66C2]">${r.cat}</div>
                <div class="font-semibold text-sm mt-1 group-hover:text-[#0A66C2] leading-snug">${r.title}</div>
                <div class="text-xs text-gray-400 mt-1">${r.read}</div>
            </a>`).join('') : '<p class="text-sm text-gray-400">Explore other categories for more guides.</p>';

        // Prev / next
        const prev = ARTICLES[idx - 1], next = ARTICLES[idx + 1];
        document.getElementById('prev-next').innerHTML = `
            ${prev ? `<a href="blog-details.html?id=${prev.id}" class="block p-5 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl group"><div class="text-xs text-gray-400">← Previous</div><div class="font-semibold mt-1 group-hover:text-[#0A66C2]">${prev.title}</div></a>` : '<div></div>'}
            ${next ? `<a href="blog-details.html?id=${next.id}" class="block p-5 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl group text-right"><div class="text-xs text-gray-400">Next →</div><div class="font-semibold mt-1 group-hover:text-[#0A66C2]">${next.title}</div></a>` : ''}`;
    </script>
</body>
</html>
