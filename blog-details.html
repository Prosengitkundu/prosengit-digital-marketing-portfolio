    <script>
        const params = new URLSearchParams(window.location.search);
        const id = parseInt(params.get('id')) || 1;
        const articles = [
            {id:1,title:"7 SEO Mistakes Most Bangladeshi Businesses Still Make",cat:"SEO",date:"Jan 12, 2025",content:"Most businesses in Bangladesh are missing out on massive organic traffic because of a few common SEO mistakes. In this article, I break down the top 7 issues I see repeatedly and how to fix them."},

        const article = articles.find(a => a.id === id) || articles[0];
        const articleImage = article.cat === 'SEO'
            ? 'https://images.pexels.com/photos/6248959/pexels-photo-6248959.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=1200&h=680'

        document.getElementById('article-content').innerHTML = `

            <h1 class="text-6xl heading-font tracking-tighter font-bold mt-4">${article.title}</h1>
