        function renderBlog() {
            const container = document.getElementById('blog-grid');
            container.innerHTML = '';
            articles.forEach(a => {
                const el = document.createElement('div');
                el.className = `blog-card bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-7 rounded-3xl`;
                el.innerHTML = `
                    <img src="${blogImages[a.cat] || blogImages.Marketing}" alt="${a.title}" class="w-full aspect-[16/9] object-cover rounded-2xl mb-6" width="900" height="520" loading="lazy" decoding="async">

                    <div class="text-sm mt-3 text-gray-600 dark:text-gray-300">${a.excerpt}</div>
                    <div class="mt-6 flex items-center justify-between">
                        <div class="text-xs">${a.read} read</div>
                        <button onclick="readArticle(${a.id})" class="text-sm font-semibold text-[#0A66C2]">Read Article →</button>
                    </div>`;
                container.appendChild(el);
            });
        }
        
        function readArticle(id) {
            const article = articles.find(a => a.id === id);
            alert(`"${article.title}"\n\nThank you for reading! Full article content is available on the blog detail page.\n\nThis is a production-ready static site.`);
            window.location.href = `blog-details.html?id=${id}`;
